name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK For Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./UNILAG-CGPA-Calculator.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNILAG-CGPA-Calculator-Debug-APK
          path: ./UNILAG-CGPA-Calculator.apk
          retention-days: 30

      - name: Publish Public Release with Direct Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Android Build' }}
          body: |
            ### UNILAG CGPA Calculator — Android App 🎓📱

            Tap below to download the application directly to your Android device:
            - **[Download UNILAG CGPA Calculator APK](https://github.com/${{ github.repository }}/releases/latest/download/UNILAG-CGPA-Calculator.apk)**

            ---
            #### Installation Instructions:
            1. Tap the direct download link on your phone.
            2. When the download completes, tap the file in your notification bar or Downloads folder.
            3. If Android displays *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and turn on **Allow from this source**.
            4. Tap **Install** and enjoy tracking your CGPA on mobile!
          files: ./UNILAG-CGPA-Calculator.apk
          prerelease: false
          draft: false
